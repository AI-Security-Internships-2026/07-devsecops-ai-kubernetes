apiVersion: v1
kind: Namespace
metadata:
  name: dataset-b
  labels:
    purpose: dataset-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-baseline
  namespace: dataset-b
  labels:
    app: dsb-baseline
    scenario: baseline
  annotations:
    dataset-b/expect: "unchanged"
    dataset-b/rationale: "The reference point for nginx:1.21. Every expectation on that image is expressed relative to this configuration, so it must itself be neutral: running (so the finding is live), unreachable from outside (so exposure cannot escalate) and unprivileged (so privilege cannot escalate)."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-baseline
  template:
    metadata:
      labels:
        app: dsb-baseline
        scenario: baseline
    spec:
      containers:
      - name: app
        image: nginx:1.21
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-baseline-httpd
  namespace: dataset-b
  labels:
    app: dsb-baseline-httpd
    scenario: baseline-httpd
  annotations:
    dataset-b/expect: "unchanged"
    dataset-b/rationale: "httpd:2.4.49 needs its own reference because it shares almost no CVEs with nginx. Without it, the not-deployed scenario below would be scored against an unrelated package set and the handful of coincidental overlaps would be misread as a context effect."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-baseline-httpd
  template:
    metadata:
      labels:
        app: dsb-baseline-httpd
        scenario: baseline-httpd
    spec:
      containers:
      - name: app
        image: httpd:2.4.49
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-baseline-python
  namespace: dataset-b
  labels:
    app: dsb-baseline-python
    scenario: baseline-python
  annotations:
    dataset-b/expect: "unchanged"
    dataset-b/rationale: "The reference for the language-ecosystem image, for the same same-image reason."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-baseline-python
  template:
    metadata:
      labels:
        app: dsb-baseline-python
        scenario: baseline-python
    spec:
      containers:
      - name: app
        image: python:3.9-slim
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-exposed-nodeport
  namespace: dataset-b
  labels:
    app: dsb-exposed-nodeport
    scenario: exposed-nodeport
  annotations:
    dataset-b/expect: "escalate"
    dataset-b/rationale: "Reachability from outside the cluster is the single largest change in real exploitability for a network-facing service, and it is the case every commercial tool markets as reachability analysis. If context escalation does not fire here it does not work at all."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-exposed-nodeport
  template:
    metadata:
      labels:
        app: dsb-exposed-nodeport
        scenario: exposed-nodeport
    spec:
      containers:
      - name: app
        image: nginx:1.21
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dsb-exposed-nodeport
  namespace: dataset-b
  labels:
    scenario: exposed-nodeport
spec:
  type: NodePort
  selector:
    app: dsb-exposed-nodeport
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-exposed-loadbalancer
  namespace: dataset-b
  labels:
    app: dsb-exposed-loadbalancer
    scenario: exposed-loadbalancer
  annotations:
    dataset-b/expect: "escalate"
    dataset-b/rationale: "Included to confirm the escalation follows *exposure* rather than one specific Service type. A result that held for NodePort but not LoadBalancer would indicate the context provider is pattern-matching on type strings instead of deriving reachability."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-exposed-loadbalancer
  template:
    metadata:
      labels:
        app: dsb-exposed-loadbalancer
        scenario: exposed-loadbalancer
    spec:
      containers:
      - name: app
        image: nginx:1.21
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dsb-exposed-loadbalancer
  namespace: dataset-b
  labels:
    scenario: exposed-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: dsb-exposed-loadbalancer
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-privileged-internal
  namespace: dataset-b
  labels:
    app: dsb-privileged-internal
    scenario: privileged-internal
  annotations:
    dataset-b/expect: "escalate"
    dataset-b/rationale: "Privilege escalates independently of network exposure: a compromise in a privileged pod reaches the node. Separating this from the exposed scenarios is what shows the two signals are independent rather than one standing in for the other."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-privileged-internal
  template:
    metadata:
      labels:
        app: dsb-privileged-internal
        scenario: privileged-internal
    spec:
      containers:
      - name: app
        image: nginx:1.21
        securityContext:
          privileged: true
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
# scenario 'not-deployed': intentionally NOT deployed
# An image absent from the cluster poses no current risk there, so findings should fall to Track -- EXCEPT those under confirmed active exploitation, which must stay actionable because the usual reason to scan an un-deployed image is that someone is about to deploy it. Both halves are tested in one scan: the exempt CVEs are the regression test for a defect that previously gave 0% KEV recall on this exact image. This scenario also pairs with the mode check in the runbook -- the same scan in pre-deployment mode must de-escalate nothing at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-runtime-attributable
  namespace: dataset-b
  labels:
    app: dsb-runtime-attributable
    scenario: runtime-attributable
  annotations:
    dataset-b/expect: "escalate"
    dataset-b/rationale: "The positive case for package-level attribution. Only findings affecting coreutils should escalate; every other finding on the same image must be untouched, which is the property issue #17 was opened about."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-runtime-attributable
  template:
    metadata:
      labels:
        app: dsb-runtime-attributable
        scenario: runtime-attributable
    spec:
      containers:
      - name: app
        image: nginx:1.21
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-runtime-unattributable
  namespace: dataset-b
  labels:
    app: dsb-runtime-unattributable
    scenario: runtime-unattributable
  annotations:
    dataset-b/expect: "unchanged"
    dataset-b/rationale: "The negative case, and the more important of the two. Unattributable evidence annotating rather than escalating is what separates this design from image-wide runtime scoring; a failure here reproduces the original defect where one alert escalated 20 of 22 findings."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-runtime-unattributable
  template:
    metadata:
      labels:
        app: dsb-runtime-unattributable
        scenario: runtime-unattributable
    spec:
      containers:
      - name: app
        image: nginx:1.21
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsb-language-packages
  namespace: dataset-b
  labels:
    app: dsb-language-packages
    scenario: language-packages
  annotations:
    dataset-b/expect: "escalate"
    dataset-b/rationale: "Confirms contextual escalation behaves identically when the findings come from language-ecosystem packages (site-packages distributions) rather than OS packages, which reach the engine through a different enrichment and attribution path. It was originally written as an internal-only scenario, which made it configuration- identical to baseline-python -- the same scan scored against itself, testing nothing. Exposure is the independent variable that gives it something to measure."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsb-language-packages
  template:
    metadata:
      labels:
        app: dsb-language-packages
        scenario: language-packages
    spec:
      containers:
      - name: app
        image: python:3.9-slim
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dsb-language-packages
  namespace: dataset-b
  labels:
    scenario: language-packages
spec:
  type: NodePort
  selector:
    app: dsb-language-packages
  ports:
  - port: 80
    targetPort: 80
